# Render Blueprint — one-click deploy for God's Eye View.
#
# Render runs Node, which this app needs: ~25 API endpoints (CCTV proxy,
# flights, satellites, geocoding, weather) live in the Vite server, so a
# static host like GitHub Pages cannot serve it.
#
# Auto-deploy is on: every push to the default branch rebuilds and redeploys.
services:
  - type: web
    name: gods-eye-view
    runtime: node
    plan: starter
    autoDeploy: true
    buildCommand: PUPPETEER_SKIP_DOWNLOAD=true npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      # Render's free tier runs Node 22 by default; this app requires 24.14.x or 26.x.
      - key: NODE_VERSION
        value: 24.15.0
      # Chromium is used by local QA scripts, not by the deployed site.
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      # Allow Render's onrender.com suffix and the exact service hostname.
      - key: PREVIEW_ALLOWED_HOSTS
        value: ".onrender.com,vista-nivel-dios.onrender.com"
      # Render terminates TLS and forwards on this port.
      - key: HOST
        value: "0.0.0.0"
      - key: GEV_TRUST_PROXY
        value: "1"
      - key: GEV_FREE_FOR_ALL
        value: "1"
      - key: APP_BASE_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: gev-subscriptions
          property: connectionString

      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_MONTHLY
        sync: false
      - key: STRIPE_PRICE_ANNUAL
        sync: false

      # Browser key: restrict to your site referrer and Maps Tiles API.
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      # Server-only key: restrict to Places and Street View Static APIs.
      - key: GOOGLE_MAPS_SERVER_API_KEY
        sync: false
      - key: CESIUM_ION_TOKEN
        sync: false

      # REQUIRED FOR CONVERSATIONAL VOICE. Without it the microphone still
      # works — navigation, layer toggles, view control and incident search all
      # run off a local matcher with no network call — but it cannot hold a
      # conversation, because there is no model to ask.
      #
      # Free: an OpenRouter key costs nothing and the app only ever calls
      # models whose ids end in ":free". Get one at https://openrouter.ai/keys
      #
      # sync: false means Render prompts for the value in the dashboard and it
      # NEVER enters this repository. That matters more than usual here: this
      # repo is public, so a key committed to it would be scraped within
      # minutes and would live in the git history permanently.
      - key: OPENROUTER_API_KEY
        sync: false

      # ---- Camera licensing ----
      # These packs are OFF here on purpose. Their terms permit personal use but
      # NOT redistribution, which is what a public URL is:
      #   FL511 (Miami)      "individual use only ... not available for re-use
      #                       without the express written consent of FDOT"
      #   Autostrade (Italy)  all rights reserved
      #   Ozolio / GMCVB      permission required
      #   WeatherSTEM         written permission required
      #   Vedetta             no terms published
      # Everything still enabled is openly licensed (OGL, CC BY, CC0, or
      # commercial-use-permitted). See config/cctv_catalogs.json for each one.
      - key: CCTV_FL511_ENABLED
        value: "0"
      - key: CCTV_SOURCES_FILE
        value: ""
      - key: CCTV_WORLD_CATALOGS
        value: "ca-on,ca-toronto,ca-calgary,us-ny,us-il,us-wa,us-or,us-ut,us-ia,us-la,us-hi,ie-tii,fr-lyon,ch-geneva,fi-digitraffic,no-vegvesen,se-stockholm,se-goteborg,is-vegagerdin,ee-tarktee,lt-eismoinfo,hk-td,nz-nzta,au-nsw,au-qld,sg-lta,es-dgt,es-madrid-m30,es-malaga,es-vitoria"
      - key: CCTV_WORLD_MAX_PER_CATALOG
        value: "80"
      - key: CCTV_MAX_SOURCES
        value: "3000"

databases:
  - name: gev-subscriptions
    databaseName: gev_subscriptions
    user: gev_subscriptions
    plan: starter
